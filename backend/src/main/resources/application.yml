server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/billiard_club?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456789"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  # Mapper XML 位置（复杂 SQL 放到 resources/mapper/ 下）
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 下划线字段名自动映射驼峰属性（table_no -> tableNo）
    map-underscore-to-camel-case: true
    # SQL 统一进入 SLF4J，终端与滚动日志文件都能查看
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

logging:
  file:
    path: logs
  level:
    com.club: info
    com.club.mapper: debug
